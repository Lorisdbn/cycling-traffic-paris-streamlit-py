name: Keep Streamlit awake

on:
  schedule:
    - cron: "34 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # needed to re-enable this workflow (see last step)

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        working-directory: .github/scripts
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Visit the Streamlit app in a real browser
        working-directory: .github/scripts
        run: node keep-awake.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-screenshot
          path: .github/scripts/keep-awake.png
          retention-days: 7
          if-no-files-found: ignore

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow through the API resets that timer,
      # without needing dummy commits.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-streamlit-awake.yml/enable"

name: Keep Streamlit awake

on:
  schedule:
    - cron: "34 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # needed to re-enable this workflow (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --location --retry 3 --retry-delay 10 --max-time 90 \
            --cookie-jar "$RUNNER_TEMP/streamlit-cookies.txt" \
            --cookie "$RUNNER_TEMP/streamlit-cookies.txt" \
            --user-agent "GitHub-Actions-Streamlit-Keepalive" \
            "https://cycling-traffic-paris.streamlit.app/"

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow through the API resets that timer,
      # without needing dummy commits.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-streamlit-awake.yml/enable"
